[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchpilot-ai"
version = "0.1.0"
description = "Governed autonomous software engineering agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arees Shah" }]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["patchpilot"]
